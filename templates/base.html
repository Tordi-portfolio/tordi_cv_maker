<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Maker | Build Your Future</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-bold">CV Maker</a>
            
            <button id="menu-btn" class="md:hidden focus:outline-none">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>

            <div class="hidden md:flex space-x-6 items-center">
                <a href="{% url 'home' %}" class="hover:underline">Home</a>
                <a href="{% url 'create_cv' %}" class="hover:underline">Create CV</a>
                <a href="{% url 'all_cvs' %}" class="hover:underline">Browse CVs</a>
                {% if user.is_authenticated %}
                    <span class="font-medium">Hello, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded transition">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:underline">Login</a>
                    <a href="{% url 'register' %}" class="bg-white text-blue-600 px-4 py-2 rounded font-semibold hover:bg-gray-100">Register</a>
                {% endif %}
            </div>
        </div>

        <div id="mobile-menu" class="md:hidden hidden mt-4 flex flex-col space-y-3 bg-blue-700 p-4 rounded-lg">
            <a href="{% url 'all_cvs' %}" class="block hover:underline">Browse CVs</a>
            {% if user.is_authenticated %}
                <span class="font-medium">Hello, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="bg-red-500 text-center py-2 rounded">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="hover:underline">Login</a>
                <a href="{% url 'register' %}" class="bg-white text-blue-600 text-center py-2 rounded font-semibold">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-md">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        const btn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
